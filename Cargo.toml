[package]
name = "codex-portable"
version = "0.1.0"
edition = "2021"
authors = ["João Pedro"]
license = "MIT OR Apache-2.0"

[dependencies]
tauri = { version = "1.6", features = ["web"] }
prosemirror = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono", "json"] }
thiserror = "1.0"
tower = { version = "0.4", features = ["util"] }
anyhow = "1.0"

[build-dependencies]
tauri-build = "1.6"

[profile.release]
opt-level = 3
lto = true


# CI Configuration — Matrix: Windows, macOS, Linux; x86_64, arm64

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-all:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        arch: [x86_64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: cargo install rustup --system
      - name: Build (Tauri)
        run: tauri build --release
      - name: Run tests
        run: cargo test
